# Wait 7 days before proposing a new version: freshly published packages can be malicious.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies"]
    cooldown:
      default-days: 7
