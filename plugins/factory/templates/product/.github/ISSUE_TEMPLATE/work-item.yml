name: Work item
description: One independently buildable piece of work for the factory. The spec lives in Notion.
labels: ["stage:spec"]
body:
  - type: input
    id: spec
    attributes:
      label: Spec in Notion
      description: Link to the spec page. /factory:spec fills this in.
      placeholder: https://www.notion.so/...
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: The problem or outcome in 1–3 sentences.
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Given/When/Then, numbered AC1, AC2, … These must match the approved spec.
      placeholder: |
        - AC1: Given ..., when ..., then ...
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: dropdown
    id: architecture
    attributes:
      label: Does this need an architecture note?
      description: Yes for new components, interfaces, data model changes, auth, payments, personal data, data migration or anything irreversible.
      options:
        - "No"
        - "Yes"
    validations:
      required: true
