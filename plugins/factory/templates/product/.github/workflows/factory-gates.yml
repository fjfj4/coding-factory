name: factory-gates

# Deterministic gates for a product repo. Agents cannot edit this file (guard hooks);
# make it required in branch protection for main.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: factory-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - name: Install Node dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Set up uv (Python)
        if: hashFiles('pyproject.toml') != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Python dependencies
        if: hashFiles('pyproject.toml') != ''
        run: uv sync --frozen
      - name: Run gates
        run: ./.factory/gates.sh ci

  pr-description:
    name: PR description is complete
    # Dependabot PRs don't use the template; their content is checked by the other gates.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PR template sections
        env:
          # Passed through env and never interpolated into the script, to avoid injection.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./.factory/check-pr-body.sh

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organisation repos need a free licence key: GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan
        run: semgrep scan --config p/default --config p/owasp-top-ten --config p/secrets --config p/github-actions --error --metrics=off

  dependencies:
    name: Dependency and config scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy filesystem scan
        run: >
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.58.1
          fs --scanners vuln,misconfig --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 --no-progress /src
